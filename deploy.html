<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제휴 문의</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <a href="index.html" class="logo">Back to Home</a>
        </header>

        <main class="main-content">
            <div class="form-container">
                <h1>제휴 문의</h1>
                <p>궁금한 점이 있으시거나 제휴를 원하시면 아래 폼을 작성해주세요.</p>
                
                <form action="https://formspree.io/f/mpqyrvgg" method="POST" class="contact-form">
                    <div class="form-group">
                        <label for="name">이름</label>
                        <input type="text" id="name" name="name" required placeholder="이름을 입력해주세요">
                    </div>
                    
                    <div class="form-group">
                        <label for="email">이메일</label>
                        <input type="email" id="email" name="email" required placeholder="이메일을 입력해주세요">
                    </div>
                    
                    <div class="form-group">
                        <label for="message">메시지</label>
                        <textarea id="message" name="message" rows="5" required placeholder="내용을 입력해주세요"></textarea>
                    </div>
                    
                    <button type="submit" class="submit-btn">보내기</button>
                </form>
            </div>
        </main>

        <footer class="footer">
            <p>&copy; 2026 Your Company. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
